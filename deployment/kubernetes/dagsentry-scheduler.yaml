apiVersion: v1
kind: ServiceAccount
metadata:
  name: dagsentry-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagsentry-scheduler
  labels:
    app.kubernetes.io/name: dagsentry-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dagsentry-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dagsentry-scheduler
    spec:
      serviceAccountName: dagsentry-scheduler
      terminationGracePeriodSeconds: 300
      containers:
        - name: scheduler
          image: ghcr.io/example/dagsentry:replace-me
          args: ["dagsentry-scheduler"]
          envFrom:
            - configMapRef:
                name: dagsentry-runtime
          env:
            - name: DAGSENTRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dagsentry-runtime
                  key: database-url
            - name: DAGSENTRY_CONNECTION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dagsentry-runtime
                  key: connection-encryption-key
          readinessProbe:
            exec:
              command: ["dagsentry-scheduler-health"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["dagsentry-scheduler-health"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
