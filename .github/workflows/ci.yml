name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_dagsentry
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_dagsentry"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      DAGSENTRY_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_dagsentry
      DAGSENTRY_TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_dagsentry
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest

  airflow-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        airflow:
          - name: minimum
            specifier: apache-airflow==3.1.8
            version: "3.1.8"
          - name: reference
            specifier: apache-airflow==3.3.1
            version: "3.3.1"
    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install project with Airflow
        run: uv sync --locked --extra airflow

      - name: Select Airflow compatibility target
        run: uv pip install --upgrade "${{ matrix.airflow.specifier }}"

      - name: Test Airflow plugin compatibility
        run: |
          uv run --no-sync python -c 'import importlib.metadata as m; assert m.version("apache-airflow") == "${{ matrix.airflow.version }}"'
          uv run --no-sync pytest tests/airflow

      - name: Verify Airflow provider discovery
        env:
          AIRFLOW__CORE__LAZY_DISCOVER_PROVIDERS: "True"
          AIRFLOW__CORE__LAZY_LOAD_PLUGINS: "True"
        run: uv run --no-sync airflow plugins

  production-compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and verify production Compose deployment
        run: bash scripts/verify-production-compose.sh

  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Node for browser tests only
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install project and test-only Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/dagsentry-ui-check/browsers
        run: |
          uv sync --locked
          npm install --prefix "$RUNNER_TEMP/dagsentry-ui-check" --no-save --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/dagsentry-ui-check/node_modules/.bin/playwright" install --with-deps chromium --only-shell

      - name: Test modules and UI contracts
        run: uv run pytest tests/test_web_ui.py tests/test_web_ui_behavior.py tests/test_web_ui_tabler.py -q

      - name: Verify Chromium against an isolated demo database
        env:
          NODE_PATH: ${{ runner.temp }}/dagsentry-ui-check/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/dagsentry-ui-check/browsers
          DAGSENTRY_UI_SCREENSHOTS: ${{ runner.temp }}/frontend-browser/screenshots
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-data" "$RUNNER_TEMP/frontend-browser"
          TMPDIR="$RUNNER_TEMP/frontend-data" .venv/bin/python -u scripts/run-ui-demo.py > "$RUNNER_TEMP/frontend-browser/demo.log" 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true; wait "$demo_pid" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then break; fi
            if ! kill -0 "$demo_pid" 2>/dev/null; then cat "$RUNNER_TEMP/frontend-browser/demo.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null
          node scripts/verify-ui-tabler.cjs

      - name: Preserve screenshots and demo logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-browser
          path: ${{ runner.temp }}/frontend-browser
          retention-days: 7
          if-no-files-found: ignore
